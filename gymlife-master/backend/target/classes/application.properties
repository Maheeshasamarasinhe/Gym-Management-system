# ========================
# Server Configuration
# ========================
server.port=8081

# ========================
# MySQL Database Config
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate Config
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================
# JWT Configuration
# ========================
jwt.secret=Z3ltbGlmZS1iYWNrZW5kLXNlY3JldC1rZXktMjAyNi1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
jwt.expiration=86400000

# ========================
# CORS (allow React frontend)
# ========================
cors.allowed-origins=http://localhost:3000

# ========================
# SQL Init (run schema on startup)
# ========================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ========================
# Swagger / OpenAPI
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
